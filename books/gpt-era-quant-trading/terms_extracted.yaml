# 《GPT时代的量化交易：底层逻辑与技术实践》术语表
# 提取范围：Section10-35

# 核心概念术语
- id: g36
  term: 阿尔法（Alpha）
  type: glossary
  source_chapter: 2.3.1, 2.4.1
  definition: |
    投资市场的超额收益，主动管理型基金的目标就是获取市场的超额收益，与整体市场无关的收益部分。
  common_usage: |
    无差异，是金融投资领域的标准术语。
  example: |
    "阿尔法（Alpha）指投资市场的超额收益，主动管理型基金的目标就是获取市场的超额收益"
  tags: [核心概念, 投资收益, 风险收益分离]

- id: g37
  term: 贝塔（Beta）
  type: glossary
  source_chapter: 2.3.1, 2.4.1
  definition: |
    来源于整体投资市场的平均收益，传统市值加权的指数基金的目标就是获取整体投资市场的平均收益，和市场一起波动的部分。
  common_usage: |
    无差异，是金融投资领域的标准术语。
  example: |
    "贝塔（Beta）指来源于整体投资市场的平均收益"
  tags: [核心概念, 市场收益, 系统性风险]

- id: g38
  term: Smart Beta（聪明贝塔）
  type: glossary
  source_chapter: 2.3.1
  definition: |
    投资者通过增强一个或多个不同因子的特征，对资产进行选股及优化个股权重。这是一种基于透明且固定规则的投资策略，非市值加权，被动交易，期望其收益能超过传统指数基金获取的贝塔收益。
  common_usage: |
    作者特别强调其理论基础是因子投资（Factor Investing），该策略的收益来自因子的风险溢价。
  example: |
    "聪明贝塔投资策略的理论基础是因子投资（Factor Investing），该策略的收益来自因子的风险溢价"
  tags: [核心概念, 因子投资, 被动策略, Smart Beta]

- id: g39
  term: 因子（Factor）
  type: glossary
  source_chapter: 3.1
  definition: |
    与股票的收益和风险密切相关的一类关键数据特征。用来反映众多原始变量的主要信息，是理解、分析和应用数据的手段和桥梁。
  common_usage: |
    无差异，是量化交易的基础概念。
  example: |
    "量化交易策略中所谓的因子，是指与股票的收益和风险密切相关的一类关键数据特征"
  tags: [核心概念, 因子, 数据特征]

- id: g40
  term: 反身性理论（Theory of Reflexivity）
  type: glossary
  source_chapter: 2.5.2
  definition: |
    索罗斯提出的理论，认为金融市场中的投资者做多情绪会在上涨行情中得到不断的正向激励，进而致使连续暴涨；同样，做空情绪也会在下跌行情中得到不断的正向激励，进而致使连续暴跌。
  common_usage: |
    索罗斯独特的投资哲学，不被主流经济学界接纳但在实践中被证明有效。强调市场参与者的认知与市场现实之间的相互影响。
  example: |
    "根据反身性理论，金融市场中的投资者做多情绪会在上涨行情中得到不断的正向激励，进而致使连续暴涨的情况的出现"
  tags: [核心概念, 索罗斯, 市场心理, 正反馈]

- id: g41
  term: 凯利公式（Kelly Criterion）
  type: glossary
  source_chapter: 3.3.1
  definition: |
    一种根据赌博赢或输的概率，计算出每次下注的资金占所有赌本的最佳比例的公式。公式为f*=(bp-q)/b，通过寻找能最大化结果对数期望值的资本比例来获得资金长期增长率的最大化。
  common_usage: |
    无差异，是资金管理的经典数学工具。
  example: |
    "凯利公式是一种根据赌博赢或输的概率，计算出每次下注的资金占所有赌本的最佳比例的公式"
  tags: [核心概念, 资金管理, 仓位控制, 凯利公式]

- id: g42
  term: 金融交易"不可能三角"
  type: glossary
  source_chapter: 3.2.2
  definition: |
    策略长期有效性、高收益风险比、高资金容量，三者不可兼得。如果三者兼得，那么全世界所有的钱就都被你赚走了。
  common_usage: |
    作者特别强调的核心概念，用于指导策略设计时的取舍。类似于经济学中的"蒙代尔不可能三角"，但应用于量化交易策略设计。
  example: |
    "如果三者兼得，那么全世界所有的钱就都被你赚走了"
  tags: [核心概念, 策略设计, 权衡取舍]

- id: g43
  term: 夏普比率（Sharpe Ratio）
  type: glossary
  source_chapter: 3.4.3
  definition: |
    在金融领域衡量一项投资在被调整风险后相对于无风险资产的表现。定义是投资收益与无风险收益之差的期望值，再除以投资标准差，代表投资者额外承受的每一单位风险所获得的额外收益。
  common_usage: |
    无差异，是风险调整后收益的标准衡量指标。
  example: |
    "夏普比率的定义是投资收益与无风险收益之差的期望值，再除以投资标准差"
  tags: [核心概念, 绩效评估, 风险调整收益, 夏普比率]

- id: g44
  term: 算法交易
  type: glossary
  source_chapter: 5.2.1
  definition: |
    利用电子平台，输入涉及算法的交易指令，以执行预先设定好的交易策略。算法中包含许多变量，包括时间、价格、交易量等。专注于订单的执行过程，核心目标是又好又快地完成交易订单。
  common_usage: |
    无差异，是现代交易技术的标准术语。
  example: |
    "算法交易是指利用电子平台，输入涉及算法的交易指令，以执行预先设定好的交易策略"
  tags: [核心概念, 算法交易, 订单执行]

# 策略类术语
- id: g45
  term: RSRS择时量化交易策略
  type: glossary
  source_chapter: 2.3.3
  definition: |
    阻力支撑相对强度（Resistance Support Relative Strength）策略，区别于传统择时策略将阻力位与支撑位设定为绝对阈值的方式，使用相对强度（如斜率、标准化等参数）作为判断点，引入更多的动态因素，反映交易者对当前市场状态顶底的预判。
  common_usage: |
    作者强调其与传统绝对阈值方式的区别，采用动态相对强度指标。
  example: |
    "RSRS择时量化交易策略使用相对强度作为判断点，引入更多的动态因素"
  tags: [策略类型, 择时策略, RSRS, 技术分析]

- id: g46
  term: 打板量化交易策略
  type: glossary
  source_chapter: 2.3.4
  definition: |
    通过计算机自动运算，在涨停板或者股价涨停的时候买入或卖出股票的策略。通过数量化的方式，帮助投资者保持理性，克服人性中的贪婪、恐惧与优柔寡断等缺点。
  common_usage: |
    无差异，是A股市场特有的交易策略术语。
  example: |
    "打板量化交易策略指通过计算机自动运算，在涨停板或者股价涨停的时候卖出股票的打板策略"
  tags: [策略类型, 打板, 涨停板, A股特色]

- id: g47
  term: 一字板
  type: glossary
  source_chapter: 2.3.4
  definition: |
    股票中的"一字板开板"现象，指新股或停牌重组的个股在经过若干天的一字涨停潮后，当天集合竞价所产生的开盘价小于股市规定的涨停价。K线的开盘价、最高价、最低价、收盘价相同。
  common_usage: |
    中国A股特有的交易现象，由于涨跌停板制度产生。
  example: |
    "一字板则指开盘后股价立马涨停，K线的开盘价、最高价、最低价、收盘价相同"
  tags: [策略类型, 一字板, 涨停板, A股特色, K线形态]

- id: g48
  term: 高频交易
  type: glossary
  source_chapter: 2.5.3
  definition: |
    市场微观层面的一种交易模式。特点是周转率和订单率都很高，能在毫秒内满足大量买卖和取消指令的要求，并能在极短的市场变化中寻求获利机会。具有处理分笔交易数据、高资金周转率、日内开平仓、算法交易四个特点。
  common_usage: |
    无差异，是交易技术领域的标准术语。
  example: |
    "高频交易是市场微观层面的一种交易模式，其特点是周转率和订单率都很高"
  tags: [策略类型, 高频交易, 微观结构]

- id: g49
  term: 订单薄（Orderbook）高频因子
  type: glossary
  source_chapter: 2.5.3
  definition: |
    属于高频交易策略中的"敞口订单"模型，也就是做市高频。量化交易者通过对订单簿的不平衡和流动性缺失等信息来进行策略构建。
  common_usage: |
    无差异，是高频交易的专业术语。
  example: |
    "订单薄高频因子属于高频交易策略中的'敞口订单'模型，也就是我们通常讲的做市高频"
  tags: [策略类型, 高频交易, 订单薄, 做市]

- id: g50
  term: 事件驱动量化交易策略
  type: glossary
  source_chapter: 2.5.4
  definition: |
    在提前挖掘和深入分析可能造成股价异常波动的事件的基础上，通过充分把握交易时机获取超额投资收益的交易策略。采用一系列合理的手段，提前分析出可能对股价产生影响的事件将要公布的内容和时间范围。
  common_usage: |
    无差异，是量化交易的标准策略分类。
  example: |
    "事件驱动量化交易策略是在提前挖掘和深入分析可能造成股价异常波动的事件的基础上"
  tags: [策略类型, 事件驱动, 信息套利]

- id: g51
  term: 连板
  type: glossary
  source_chapter: 2.3.4
  definition: |
    打板策略的一种，在市场已经涨停的股票中筛选出第二天可低吸或者涨停的标的。通常分为启动连板、连板加速、连板走坏3个阶段。
  common_usage: |
    A股特有的交易模式术语，指连续涨停板现象。
  example: |
    "连板打法是在市场已经涨停的股票中筛选出第二天可低吸或者涨停的标的"
  tags: [策略类型, 连板, 涨停板, A股特色]

- id: g52
  term: 多因子量化交易策略
  type: glossary
  source_chapter: 2.4.3
  definition: |
    基于分析影响股票价格的相关因素，选出表现可以超越大盘的股票，并进行合理的投资组合配置，以获得超额收益。如彼得·林奇多因子策略包括筛选因子和排序因子。
  common_usage: |
    无差异，是量化交易的核心策略类型。
  example: |
    "彼得·林奇的策略把需要关注的因子分成两大类：筛选因子和排序因子"
  tags: [策略类型, 多因子, 因子投资]

# 技术指标术语
- id: g53
  term: IC（信息系数，Information Coefficient）
  type: glossary
  source_chapter: 3.1.2
  definition: |
    表示所选股票的因子值与股票下期收益率的截面相关系数，通过IC值可以判断因子值对下期收益率的预测能力。信息系数的绝对值越大，该因子越有效。IC为负表示因子值越小越好，IC为正表示因子值越大越好。
  common_usage: |
    无差异，是因子有效性检验的标准指标。
  example: |
    "IC是指信息系数，表示所选股票的因子值与股票下期收益率的截面相关系数"
  tags: [技术指标, 因子检验, IC, 预测能力]

- id: g54
  term: 换手率
  type: glossary
  source_chapter: 3.1.2
  definition: |
    在因子分析中，用于预测交易成本，计算相邻两期选股组合中股票的平均换手率。如果因子挑选出来的每一期股票的变动范围不大，那么对应的换手率就不高，交易成本相对就会比较低。
  common_usage: |
    量化交易中的特定含义，与通常意义的换手率（成交量/流通股本）不同，这里指组合调仓的换手率。
  example: |
    "换手率分析的主要作用是预测交易成本"
  tags: [技术指标, 交易成本, 换手率, 组合调仓]

- id: g55
  term: 阿尔法101因子
  type: glossary
  source_chapter: 3.1.2
  definition: |
    WorldQuant在2015年论文"101 Formulaic Alphas"中公开的101个经典的阿尔法因子及构建的公式，是量化因子领域的标杆。
  common_usage: |
    行业标杆性的因子库，是量化交易从业者的重要参考。
  example: |
    "WorldQuant在其2015年发表的论文中公开了101个经典的阿尔法因子"
  tags: [技术指标, 阿尔法因子, WorldQuant, 因子库]

- id: g56
  term: 阿尔法002因子
  type: glossary
  source_chapter: 3.1.2
  definition: |
    基于价量理论的技术分析因子，公式为：-1*correlation(rank(delta(log(volume),2)),rank((close-open)/open),6)。用于区分放量上涨、缩量上涨、缩量下跌、放量下跌四种情况。
  common_usage: |
    具体的因子公式示例，体现量价关系的技术分析逻辑。
  example: |
    "阿尔法002因子的底层逻辑是技术分析中的价量理论"
  tags: [技术指标, 阿尔法因子, 价量关系, 因子公式]

- id: g57
  term: 滚动夏普比率
  type: glossary
  source_chapter: 3.4.3
  definition: |
    夏普比率的衍生算法，根据上次计算的数据周期（如252个工作日）得出，用于跟踪策略有效性。如果滚动夏普比率已经开始超过回测历史中的最大跌幅，则通常预示着这个量化交易策略可能已经失效。
  common_usage: |
    用于策略有效性监控的动态指标，强调滚动计算的特点。
  example: |
    "就跟踪有效性而言，滚动夏普比率是一个非常好用的工具"
  tags: [技术指标, 夏普比率, 策略监控, 有效性跟踪]

- id: g58
  term: ROE（净资产收益率）
  type: glossary
  source_chapter: 3.5.2
  definition: |
    Return On Equity，衡量公司财务状况的重要指标。在米伦坎普的投资逻辑中，ROE应该达到15%或者更高。
  common_usage: |
    无差异，是财务分析的标准指标。
  example: |
    "价值线投资主线是寻找财务状况良好且净资产收益率不错的公司，ROE应该达到15%或者更高"
  tags: [技术指标, 财务指标, ROE, 盈利能力]

- id: g59
  term: 手肘法
  type: glossary
  source_chapter: 4.3.2
  definition: |
    K-means聚类中最常用的选择K值的方法。通过不断增加K值，观察误差平方和的变化。当K值达到真实簇的数量后，误差平方和的下降幅度会迅速减小，绘图时会出现一个明显的拐点，整体图形类似手肘的形态。
  common_usage: |
    无差异，是机器学习中聚类算法的标准方法。
  example: |
    "K-means最常用的选择K值的方法是手肘法"
  tags: [技术指标, 机器学习, 聚类, 参数选择]

# 风险控制术语
- id: g60
  term: 2%法则
  type: glossary
  source_chapter: 3.3.2
  definition: |
    索普提出的著名风险控制法则，当你过度下注时，你将会失去一切。如果从不一次下注超过总筹码的2%，就永远也不可能输光所有的钱。在21点的赌博中如此，投资也一样。
  common_usage: |
    经典的风险控制法则，广泛应用于投资实践。
  example: |
    "索普有一个著名的'2%法则'：当你过度下注时，你将会失去一切"
  tags: [风险控制, 仓位管理, 2%法则, 资金管理]

- id: g61
  term: 未来函数
  type: glossary
  source_chapter: 3.4.1
  definition: |
    可能引用了未来数据的函数，即引用或利用了当时还没有发生或者还不确定的数据对之前作出的判断进行修正的函数。基本特征是买卖信号不确定，常常是某日发出了买入或卖出信号，第二天如果继续下跌或上涨，则该信号消失。
  common_usage: |
    量化交易中的致命错误，会导致回测结果失真。
  example: |
    "所谓'未来函数'，是指可能引用了未来数据的函数"
  tags: [风险控制, 回测陷阱, 未来函数, 数据穿越]

- id: g62
  term: 过度拟合（Over Fitting）
  type: glossary
  source_chapter: 3.4.2
  definition: |
    过于密切或精确地匹配特定数据集，以至于出现了无法良好地拟合其他数据或预测未来的观察结果的现象。对于有限的数据而言，参数过多或者结构过于复杂的统计模型。当发生过度拟合时，模型的偏差很小，但方差很大。
  common_usage: |
    无差异，是统计学和机器学习的标准术语。
  example: |
    "在统计学中，过度拟合是指过于密切或精确地匹配特定数据集"
  tags: [风险控制, 模型风险, 过度拟合, 泛化能力]

- id: g63
  term: 止盈止损
  type: glossary
  source_chapter: 3.2.3
  definition: |
    止盈（停利）是投资者在投资前预先设定目标价位，当价格触及该价位时即沽出，将账面利润套现。止损（割肉/停损）是投资者为保住本金，在投资时预先设定止蚀沽盘，若价格下跌至止蚀盘价位即卖出，以免亏损进一步扩大。
  common_usage: |
    无差异，是交易管理的基本术语。
  example: |
    "止盈止损可以分成五大类21种：固定类、移动类、时间类、比较类、组合类"
  tags: [风险控制, 止盈止损, 交易管理]

- id: g64
  term: 凯利公式变形公式
  type: glossary
  source_chapter: 3.3.1
  definition: |
    适用于部分本金参与的情形，公式为f*=[p*W-q*L]/(W*L)，其中W是获胜后的净盈率，L是失败后的净损率。更适合计算固定类止盈止损的股票。
  common_usage: |
    针对实际交易场景的改进版本，更贴合非全仓操作的情况。
  example: |
    "这个变形公式很适合计算固定类止盈止损的股票"
  tags: [风险控制, 凯利公式, 仓位管理, 资金管理]

# 机器学习术语
- id: g65
  term: 监督学习
  type: glossary
  source_chapter: 4.3.1
  definition: |
    在数据有正确标签的情况下建立模型，并通过这一正确标签让模型进行自我修正，使其预测结果不断地朝着正确的方向迈进。训练数据集中不光有特征数据，还包含了标签数据。
  common_usage: |
    无差异，是机器学习的基本分类。
  example: |
    "监督学习是指我们在数据有正确标签的情况下建立模型"
  tags: [机器学习, 监督学习, 标签数据]

- id: g66
  term: 无监督学习
  type: glossary
  source_chapter: 4.3.2
  definition: |
    没有任何的数据标注，只有特征数据本身。更倾向于从一堆无标签数据中挖掘数据的内在结构，识别不同的数据模式。主要用于解决聚类和降维两类问题。
  common_usage: |
    无差异，是机器学习的基本分类。
  example: |
    "无监督学习中没有任何的数据标注，只有特征数据本身"
  tags: [机器学习, 无监督学习, 聚类, 降维]

- id: g67
  term: K-means聚类
  type: glossary
  source_chapter: 4.3.2
  definition: |
    聚类算法中运用最为广泛的方法，K为预先设定的簇的数量，means表达簇中心是通过计算样本点的均值而得来的。可以被简单地概括为分配和优化两步。
  common_usage: |
    无差异，是经典的聚类算法。
  example: |
    "K-means方法名称中的K为预先设定的簇的数量"
  tags: [机器学习, 无监督学习, K-means, 聚类算法]

- id: g68
  term: 深度学习
  type: glossary
  source_chapter: 4.3.3
  definition: |
    机器学习领域的一个分支，一种模拟人类大脑学习数据的算法，主要通过多层人工神经网络堆叠，增加模型深度来提升模型的训练效果，处理更为复杂的现实问题。模型能够自动从数据中提取深度特征。
  common_usage: |
    无差异，是人工智能领域的核心技术。
  example: |
    "深度学习是机器学习领域的一个分支，目前普遍认为近代深度学习是从2006年发展起来的"
  tags: [机器学习, 深度学习, 神经网络]

- id: g69
  term: LSTM（长短期记忆网络）
  type: glossary
  source_chapter: 4.3.3
  definition: |
    Long Short-Term Memory，循环神经网络的改进版本。通过引入输入门、遗忘门和输出门三种门单元，有效解决了梯度消失的问题，使得模型可以记录长时间段的输入信息。
  common_usage: |
    无差异，是深度学习中处理时序数据的标准模型。
  example: |
    "长短期记忆网络通过精心的结构设计有效解决了梯度消失的问题，使得模型可以记录长时间段的输入信息"
  tags: [机器学习, 深度学习, LSTM, 时序预测]

- id: g70
  term: 特征工程
  type: glossary
  source_chapter: 4.3.1
  definition: |
    从原始数据中提取、创造输入机器学习模型的特征值，用来在提高模型精度的同时加速训练过程。是机器学习中最耗时和乏味的，但同时也是最具有创造性和"乐趣"的一部分。
  common_usage: |
    无差异，是机器学习工程实践的核心环节。
  example: |
    "特征工程主要是从原始数据中提取、创造输入机器学习模型的特征值"
  tags: [机器学习, 特征工程, 数据预处理]

# 其他专业术语
- id: g71
  term: Fama-French三因子模型
  type: glossary
  source_chapter: 2.3.1
  definition: |
    尤金·法玛教授和肯尼思·弗伦奇教授在20世纪90年代初期合作提出的股票收益模型，开启了因子投资。Smart Beta因子是以"有限理性"理论假设为基础的。
  common_usage: |
    因子投资的开创性理论，是现代量化投资的重要基础。
  example: |
    "Fama-French三因子模型开启了因子投资"
  tags: [理论模型, 因子投资, Fama-French, 三因子模型]

- id: g72
  term: 思维导图
  type: glossary
  source_chapter: 3.2.1
  definition: |
    由英国的托尼·博赞于20世纪70年代提出的一种辅助思考工具。在量化交易中，是一种用图像整理信息的图解方式，用一个中央关键词或想法以辐射线形式连接所有的代表字词、想法、任务或其他关联项目。
  common_usage: |
    作者强调其在量化策略设计中的重要作用，是整理策略逻辑的重要工具。
  example: |
    "在量化交易中，思维导图是一种用图像整理信息的图解方式"
  tags: [工具方法, 思维导图, 策略设计]

- id: g73
  term: 跨市场因子
  type: glossary
  source_chapter: 5.2.3
  definition: |
    算法交易中的常用因子，基于股票市场中个股与指数、个股与板块的联动效应来构建。如大盘上涨时个股没涨则可能补涨，个股相对大盘涨很多时大盘下跌则有补跌可能。
  common_usage: |
    算法交易特有的因子类型，强调市场间的联动关系。
  example: |
    "跨市场因子赚取的是跟随大盘的钱"
  tags: [因子类型, 跨市场因子, 算法交易, 市场联动]

- id: g74
  term: 订单因子
  type: glossary
  source_chapter: 5.2.3
  definition: |
    算法交易中的常用因子，主要根据过去的订单成交信息来对价格进行预测。对于主动成交多、换手率高、挂单比较多的股票更有效。
  common_usage: |
    高频交易的核心因子，基于订单流信息。
  example: |
    "订单因子赚取的是潜在知情者的钱"
  tags: [因子类型, 订单因子, 算法交易, 高频交易]

- id: g75
  term: 量化三问
  type: glossary
  source_chapter: 5.1.2
  definition: |
    对应哲学三问，指量化交易者在开始投资前首先要考虑的三个问题：适合什么交易策略、交易策略的逻辑源头、交易策略在现实中的演变。
  common_usage: |
    作者提出的框架性概念，用于指导量化交易者的策略选择和设计。
  example: |
    "量化三问是每个交易者在开始投资前首先要考虑的问题"
  tags: [框架概念, 策略设计, 量化哲学]

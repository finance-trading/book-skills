</div><div class="header0"><h1><span id="sigil_toc_id_1" style="font-size:22px;font-weight: bold;color:rgb(0, 0, 0);font-family:&#39;PingFang SC&#39;;display: block;text-align:center;"><b>内</b><b>容</b><b>简</b><b>介</b></span></h1></div>
<div class="part">
	<p><span style="font-size:16px;font-family:&#39;PingFang SC&#39;;">ChatGPT的横空出世，使得量化交易编程工具的使用门槛迅速降低，掌握量化交易的底层逻辑就成了重中之重。本书着重介绍量化交易模型的底层逻辑和技术实践，梳理了基本面量化、资产配置量化、贝塔量化、阿尔法量化和另类量化这5种量化交易第略，并给出了相应的实战案例及代码，初步探索了运用GPT来实现其逻辑的技术路径，从理论到实践，助你轻松上手量化交易。</span></p>
	<p><span style="font-size:16px;font-family:&#39;PingFang SC&#39;;">本书适合对量化交易感兴趣的广大投资者，尤其适合希望转型量化交易的程序员参考阅读。</span></p></div>

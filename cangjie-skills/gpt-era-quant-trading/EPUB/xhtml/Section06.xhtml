    <title>1.2 量化交易的研究对象</title>
  </head>
  <body>

<div id="Section06.xhtml">
</div><div class="header1"><h2><span id="sigil_toc_id_6" style="font-size:19px;font-weight: bold;color:rgb(0, 0, 0);font-family:&#39;PingFang SC&#39;;"><b>1</b><b>.</b><b>2</b><b> </b><b>量</b><b>化</b><b>交</b><b>易</b><b>的</b><b>研</b><b>究</b><b>对</b><b>象</b></span></h2></div>
<div class="part">
	<p><span style="font-size:16px;font-family:&#39;PingFang SC&#39;;">从狭义来看，量化交易的研究对象包括股票、期货、期权、外汇、黄金、数字货币等各类金融产品。由于不同的金融产品在特定的交易时间点有不同的交易价格数据，所以可以通过研究交易品种价格变量的观察值及其变动模式，建立推测其未来交易品种价格变化的模型，从而为量化交易提供数据分析的基础。</span></p>
	<p><span style="font-size:16px;font-family:&#39;PingFang SC&#39;;">从广义来看，一切可投资的领域均可进行数据分析（万物皆可量化），以数据分析的结果辅助作投资决策：从利用海量研报提取需重点关注的可交易的股票，到高考志愿填报（可以看作对人生的投资）。</span></p></div>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>书籍阅读器</title>
  <style>
    :root {
      --primary: #2f2a24;
      --secondary: #92400e;
      --light: #f5efe3;
      --text: #3a332c;
      --card: #fffdf6;
      --muted: #8a8072;
      --brass: #b08d57;
      --serif: Georgia, "Songti SC", "Noto Serif SC", "Times New Roman", serif;
    }

    * { box-sizing: border-box; }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background:
        radial-gradient(1100px 600px at 50% -5%, #fffdf6 0%, rgba(255,253,246,0) 65%),
        var(--light);
      color: var(--text);
    }

    .reader {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 340px;
      flex-shrink: 0;
      background: linear-gradient(180deg, #332d25, var(--primary));
      color: #f5efe3;
      padding: 1.5rem;
      overflow-y: auto;
      border-right: 3px solid rgba(176,141,87,0.45);
    }

    .sidebar a.back {
      color: rgba(245,239,227,0.65);
      text-decoration: none;
      font-size: 0.85rem;
      display: inline-block;
      margin-bottom: 1rem;
    }
    .sidebar a.back:hover { color: #f5efe3; }

    .cover-box {
      width: 132px;
      height: 198px;
      margin: 0 0 1.25rem;
      background: #efe7d5;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(245,239,227,0.55);
      font-style: italic;
      font-size: 0.8rem;
    }

    .cover-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .toc-toggle {
      display: none;
      margin: 0.5rem 0;
      padding: 0.5rem 0.75rem;
      border: 1px solid rgba(245,239,227,0.4);
      border-radius: 4px;
      background: transparent;
      color: #f5efe3;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .toc-toggle:hover { background: rgba(245,239,227,0.1); }
    .toc-toggle:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

    .sidebar h2 { font-family: var(--serif); margin: 0 0 0.25rem; font-size: 1.15rem; line-height: 1.4; }
    .sidebar p.meta { margin: 0 0 1.25rem; font-size: 0.8rem; opacity: 0.7; }
    .sidebar h3.refs-heading {
      margin: 1.25rem 0 0.5rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      opacity: 0.55;
      text-transform: uppercase;
    }

    .chapter-list { list-style: none; margin: 0; padding: 0; }
    .chapter-list li { margin-bottom: 0.25rem; }

    .chapter-list a {
      display: block;
      color: rgba(245,239,227,0.8);
      text-decoration: none;
      font-size: 0.85rem;
      padding: 0.45rem 0.6rem;
      border-radius: 4px;
      border-left: 3px solid transparent;
    }

    .chapter-list a:hover { background: rgba(245,239,227,0.09); color: #f5efe3; }

    .chapter-list a.current {
      background: rgba(245,239,227,0.14);
      color: #fff8ec;
      border-left-color: var(--brass);
    }

    .content {
      flex: 1;
      min-width: 0;
      padding: 3rem clamp(1.25rem, 5vw, 5rem);
      max-width: 1100px;
    }

    .content article {
      max-width: 760px;
      margin: 0 auto;
      font-family: var(--serif);
      font-size: 1.04rem;
      line-height: 1.95;
    }

    .content h1 {
      color: var(--primary);
      font-family: var(--serif);
      font-size: clamp(1.6rem, 3vw, 2.25rem);
      line-height: 1.3;
      margin: 0 0 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #ddcfb7;
    }

    .content h2, .content h3 { color: var(--primary); line-height: 1.4; }
    .content pre {
      background: #2f2a24;
      color: #f5efe3;
      padding: 1rem 1.2rem;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 0.85rem;
      line-height: 1.6;
    }
    .content code { font-family: Consolas, "SFMono-Regular", monospace; }
    .content :not(pre) > code {
      background: #e9deca;
      color: #5e3214;
      padding: 0.1rem 0.35rem;
      border-radius: 3px;
      font-size: 0.85em;
    }
    .content table {
      border-collapse: collapse;
      width: 100%;
      margin: 1.5rem 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      font-size: 0.9rem;
    }
    .content th, .content td {
      border: 1px solid #ddcfb7;
      padding: 0.6rem 0.75rem;
      text-align: left;
    }
    .content th { background: #eee5d4; }
    .content blockquote {
      margin: 1.5rem 0;
      padding: 0.8rem 1.2rem;
      border-left: 4px solid var(--brass);
      background: #eee5d4;
      color: #665b4d;
    }

    .chapter-progress {
      color: rgba(245,239,227,0.6);
      font-size: 0.75rem;
      margin: 0 0 1rem;
      letter-spacing: 0.04em;
    }

    .chapter-nav {
      max-width: 760px;
      margin: 3rem auto 0;
      padding-top: 1.25rem;
      border-top: 1px solid #ddcfb7;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
    }

    .chapter-nav a {
      flex: 1;
      min-width: 0;
      padding: 0.8rem 1rem;
      border: 1px solid #d4c5aa;
      border-radius: 5px;
      color: #6d3216;
      background: rgba(255,253,246,0.7);
      text-decoration: none;
      font-family: "Segoe UI", Tahoma, sans-serif;
      font-size: 0.85rem;
    }

    .chapter-nav a:last-child { text-align: right; }
    .chapter-nav a:hover { background: #fffdf6; border-color: var(--brass); }
    .chapter-nav a.disabled { visibility: hidden; pointer-events: none; }

    .content .loading { color: var(--muted); }
    .content .error { color: #9b2c24; }

    @media (max-width: 860px) {
      .reader { flex-direction: column; }
      .sidebar {
        width: 100%;
        border-right: 0;
        border-bottom: 3px solid rgba(176,141,87,0.45);
        padding: 1rem;
      }
      .cover-box { display: none; }
      .toc-panel { display: none; }
        .toc-panel.open { display: block; }
      .toc-toggle {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
      }
      .sidebar h2 { max-width: 85%; }
      .content { padding: 1.5rem 1rem 2rem; }
      .content article, .chapter-nav { max-width: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .chapter-nav a { transition: none; }
    }
  </style>
</head>
<body>
  <div class="reader">
    <nav class="sidebar" aria-label="书籍导航">
      <a class="back" href="book-browser.html">← 返回书架</a>
      <div class="cover-box" id="bookCover"><span>封面未加载</span></div>
      <h2 id="bookTitle"></h2>
      <p class="meta" id="bookMeta"></p>
      <p class="chapter-progress" id="chapterProgress"></p>
      <button class="toc-toggle" id="tocToggle" type="button" aria-expanded="false" aria-controls="tocPanel">目录</button>
      <div class="toc-panel" id="tocPanel">
        <ul id="chapterList" class="chapter-list"></ul>
        <h3 class="refs-heading" id="refsHeading" style="display:none">参考文档</h3>
        <ul id="refList" class="chapter-list"></ul>
      </div>
    </nav>

    <main class="content">
      <article>
        <h1 id="contentTitle"></h1>
        <div id="contentBody" class="loading">正在加载…</div>
        <nav class="chapter-nav" aria-label="章节导航">
          <a id="prevChapter" class="disabled" href="#" aria-disabled="true"></a>
          <a id="nextChapter" class="disabled" href="#" aria-disabled="true"></a>
        </nav>
      </article>
    </main>
  </div>

  <script>
    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[char]);
    }

    function inlineMarkdown(text) {
      const codeSpans = [];
      let html = text.replace(/`([^`]+)`/g, (_, code) => {
        codeSpans.push(code);
        return `__CODESPAN_${codeSpans.length - 1}__`;
      });
      html = escapeHtml(html);
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
      html = html.replace(/__CODESPAN_(\d+)__/g, (_, n) => `<code>${escapeHtml(codeSpans[Number(n)])}</code>`);
      return html;
    }

    function renderMarkdown(source) {
      const lines = source.replace(/\r\n?/g, '\n').split('\n');
      const out = [];
      const isTableSep = line => /^\s*\|?[\s:|-]+\|?\s*$/.test(line) && line.includes('-') && line.includes('|');

      let i = 0;
      while (i < lines.length) {
        const line = lines[i];

        if (/^```/.test(line)) {
          const code = [];
          i += 1;
          while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
          i += 1;
          out.push(`<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`);
          continue;
        }

        const heading = line.match(/^(#{1,6})\s+(.*)$/);
        if (heading) {
          const level = heading[1].length;
          out.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
          i += 1;
          continue;
        }

        if (line.includes('|') && i + 1 < lines.length && isTableSep(lines[i + 1])) {
          const rows = [line];
          i += 2;
          while (i < lines.length && lines[i].includes('|') && lines[i].trim() !== '') {
            rows.push(lines[i]);
            i += 1;
          }
          const parseRow = row => row.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(cell => cell.trim());
          let table = '<table><thead><tr>' + parseRow(rows[0]).map(cell => `<th>${inlineMarkdown(cell)}</th>`).join('') + '</tr></thead><tbody>';
          for (const row of rows.slice(1)) {
            table += '<tr>' + parseRow(row).map(cell => `<td>${inlineMarkdown(cell)}</td>`).join('') + '</tr>';
          }
          table += '</tbody></table>';
          out.push(table);
          continue;
        }

        if (/^>/.test(line)) {
          const quote = [];
          while (i < lines.length && /^>/.test(lines[i])) quote.push(lines[i++].replace(/^>\s?/, ''));
          out.push(`<blockquote>${quote.map(entry => `<p>${inlineMarkdown(entry)}</p>`).join('')}</blockquote>`);
          continue;
        }

        if (/^(\s*)([-*+]|\d+\.)\s+/.test(line)) {
          const items = [];
          while (i < lines.length) {
            const match = lines[i].match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
            if (!match) break;
            items.push({ indent: match[1].replace(/\t/g, '  ').length >= 2, ordered: /^\d/.test(match[2]), text: match[3] });
            i += 1;
          }
          // Group consecutive items that share indent + type into one list.
          const groups = [];
          for (const item of items) {
            const last = groups[groups.length - 1];
            if (last && last.indent === item.indent && last.ordered === item.ordered) {
              last.items.push(item.text);
            } else {
              groups.push({ indent: item.indent, ordered: item.ordered, items: [item.text] });
            }
          }
          let html = '';
          for (let g = 0; g < groups.length; g++) {
            const group = groups[g];
            const tag = group.ordered ? 'ol' : 'ul';
            html += `<${tag}>`;
            group.items.forEach((text, idx) => {
              html += `<li>${inlineMarkdown(text)}`;
              const nested = groups[g + 1];
              const isLast = idx === group.items.length - 1;
              if (isLast && nested && nested.indent) {
                const ntag = nested.ordered ? 'ol' : 'ul';
                html += `<${ntag}>` + nested.items.map(t => `<li>${inlineMarkdown(t)}</li>`).join('') + `</${ntag}>`;
                g += 1;
              }
              html += '</li>';
            });
            html += `</${tag}>`;
          }
          out.push(html);
          continue;
        }

        if (line.trim() === '') { i += 1; continue; }

        const para = [];
        while (i < lines.length && lines[i].trim() !== '' && !/^(#{1,6}\s|```|>|[-*+]\s|\d+\.\s|\|)/.test(lines[i])) {
          para.push(lines[i]);
          i += 1;
        }
        if (para.length) out.push(`<p>${inlineMarkdown(para.join(' '))}</p>`);
        else i += 1;
      }

      return out.join('\n');
    }

    const params = new URLSearchParams(window.location.search);
    const bookName = params.get('book') || '';

    function updateChapterNav(book, chapterPath) {
      const index = book.chapters.findIndex(entry => entry.path === chapterPath);
      document.getElementById('chapterProgress').textContent = `第 ${index + 1} / ${book.chapters.length} 章`;

      const prev = document.getElementById('prevChapter');
      const next = document.getElementById('nextChapter');
      const prevChapter = book.chapters[index - 1];
      const nextChapter = book.chapters[index + 1];
      const link = (anchor, chapter, label) => {
        if (chapter) {
          anchor.classList.remove('disabled');
          anchor.setAttribute('href', `reader.html?book=${encodeURIComponent(bookName)}&chapter=${encodeURIComponent(chapter.path)}`);
          anchor.setAttribute('aria-disabled', 'false');
          anchor.textContent = label;
          anchor.onclick = () => selectChapter(chapter.path);
        } else {
          anchor.classList.add('disabled');
          anchor.removeAttribute('href');
          anchor.setAttribute('aria-disabled', 'true');
          anchor.textContent = label;
          anchor.onclick = null;
        }
      };
      link(prev, prevChapter, `← ${prevChapter ? prevChapter.title : '已是第一章'}`);
      link(next, nextChapter, nextChapter ? `${nextChapter.title} →` : '已是最后一章');
    }

    document.addEventListener('DOMContentLoaded', async () => {
      let bookIndex = {};
      try {
        const response = await fetch('books-index.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('index not found');
        bookIndex = await response.json();
      } catch {
        document.getElementById('contentBody').textContent = '书籍索引加载失败，请通过本地服务器打开本页面。';
        return;
      }
      window.bookIndex = bookIndex;
      const book = bookIndex[bookName];
      if (!book) {
        document.getElementById('contentTitle').textContent = '未找到书籍';
        document.getElementById('contentBody').textContent = `books-index.json 中没有名为 “${bookName}” 的书籍。`;
        return;
      }

      document.getElementById('bookTitle').textContent = book.title;
      document.getElementById('bookMeta').textContent = `${book.author} · ${book.chapters.length} 章`;
      document.getElementById('bookCover').innerHTML = `<img src="covers/${encodeURIComponent(bookName)}.svg" alt="${escapeHtml(book.title)} 封面"><span>封面未加载</span>`;
      document.getElementById('bookCover').querySelector('img').addEventListener('error', event => event.currentTarget.remove());
      document.title = `${book.title} · 阅读器`;
      document.getElementById('tocToggle').addEventListener('click', () => {
        const panel = document.getElementById('tocPanel');
        const open = panel.classList.toggle('open');
        document.getElementById('tocToggle').setAttribute('aria-expanded', String(open));
      });

      document.getElementById('chapterList').innerHTML = book.chapters.map(chapter =>
        `<li><a href="reader.html?book=${encodeURIComponent(bookName)}&chapter=${encodeURIComponent(chapter.path)}" data-path="${escapeHtml(chapter.path)}" onclick="selectChapter('${escapeHtml(chapter.path)}'); return false;">${escapeHtml(chapter.title)}</a></li>`
      ).join('');

      const refs = book.refs || [];
      if (refs.length) {
        document.getElementById('refsHeading').style.display = '';
        document.getElementById('refList').innerHTML = refs.map(ref =>
          `<li><a href="reader.html?book=${encodeURIComponent(bookName)}&doc=${encodeURIComponent(ref.path)}" data-path="${escapeHtml(ref.path)}" onclick="renderReference('${escapeHtml(ref.path)}'); return false;">${escapeHtml(ref.title)}</a></li>`
        ).join('');
      }

      if (params.get('doc')) {
        await renderReference(params.get('doc'));
      } else {
        await selectChapter(params.get('chapter') || book.chapters[0].path);
      }
    });

    async function renderReference(refPath) {
      const book = window.bookIndex[bookName];
      const ref = (book.refs || []).find(entry => entry.path === refPath);
      if (!ref) return;

      const body = document.getElementById('contentBody');
      body.className = 'loading';
      body.textContent = '正在加载…';

      let markdown = '';
      try {
        const response = await fetch(`../books/${encodeURIComponent(bookName)}/${ref.path}`);
        if (!response.ok) throw new Error('reference not found');
        markdown = await response.text();
        body.className = '';
      } catch {
        body.className = 'error';
        body.textContent = `参考文档加载失败：../books/${bookName}/${ref.path}`;
        return;
      }

      const titleMatch = markdown.match(/^#\s+(.+)$/m);
      document.getElementById('contentTitle').textContent = titleMatch ? titleMatch[1] : ref.title;
      document.getElementById('contentBody').innerHTML = renderMarkdown(markdown.replace(/^#.*\n/, ''));

      document.querySelectorAll('#chapterList a').forEach(link => link.classList.remove('current'));
      document.querySelectorAll(`#refList a`).forEach(link => {
        link.classList.toggle('current', link.dataset.path === ref.path);
      });
      history.replaceState(null, '', `reader.html?book=${encodeURIComponent(bookName)}&doc=${encodeURIComponent(ref.path)}`);
    }

    async function selectChapter(chapterPath) {
      const book = window.bookIndex[bookName];
      const chapter = book.chapters.find(entry => entry.path === chapterPath) || book.chapters[0];
      if (!chapter) return;

      const body = document.getElementById('contentBody');
      body.className = 'loading';
      body.textContent = '正在加载…';

      let markdown = '';
      try {
        const response = await fetch(`../books/${encodeURIComponent(bookName)}/${chapter.path}`);
        if (!response.ok) throw new Error('chapter not found');
        markdown = await response.text();
        body.className = '';
      } catch {
        body.className = 'error';
        body.textContent = `章节加载失败：../books/${bookName}/${chapter.path}`;
        return;
      }

      const titleMatch = markdown.match(/^#\s+(.+)$/m);
      document.getElementById('contentTitle').textContent = titleMatch ? titleMatch[1] : chapter.title;
      document.getElementById('contentBody').innerHTML = renderMarkdown(markdown.replace(/^#.*\n/, ''));

      document.querySelectorAll('#chapterList a').forEach(link => {
        link.classList.toggle('current', link.dataset.path === chapter.path);
      });
      document.querySelectorAll('#refList a').forEach(link => link.classList.remove('current'));
      updateChapterNav(book, chapter.path);
      history.replaceState(null, '', `reader.html?book=${encodeURIComponent(bookName)}&chapter=${encodeURIComponent(chapter.path)}`);
    }
  </script>
</body>
</html>
